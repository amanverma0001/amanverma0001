<svg width="1280" height="280" viewBox="0 0 1280 280" xmlns="http://www.w3.org/2000/svg">

    <defs>
        <!-- Animated Gradient with your Purple -> Magenta -> Orange colors -->
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6426A5">
                <animate attributeName="stop-color"
                    values="#6426A5;#7B2CBF;#6426A5"
                    dur="10s"
                    repeatCount="indefinite"/>
            </stop>

            <stop offset="50%" stop-color="#B83280">
                <animate attributeName="stop-color"
                    values="#B83280;#D53F8C;#B83280"
                    dur="10s"
                    repeatCount="indefinite"/>
            </stop>

            <stop offset="100%" stop-color="#D97706">
                <animate attributeName="stop-color"
                    values="#D97706;#F59E0B;#D97706"
                    dur="10s"
                    repeatCount="indefinite"/>
            </stop>
        </linearGradient>

        <filter id="shadow">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Container with Rounded Corners (Tanmay Style) -->
    <rect width="1280" height="280" rx="6" fill="url(#bg)"/>

    <!-- Back Subtle Wave (Tanmay Style Low-Profile) -->
    <path fill="#00000020">
        <animate attributeName="d"
            dur="10s"
            repeatCount="indefinite"
            values="
M0 220 C320 250 640 190 960 220 C1120 235 1200 210 1280 220 L1280 280 L0 280 Z;
M0 210 C320 190 640 240 960 200 C1120 215 1200 230 1280 210 L1280 280 L0 280 Z;
M0 220 C320 250 640 190 960 220 C1120 235 1200 210 1280 220 L1280 280 L0 280 Z"/>
    </path>

    <!-- Front Wave -->
    <path fill="#00000040">
        <animate attributeName="d"
            dur="7s"
            repeatCount="indefinite"
            values="
M0 235 C240 265 480 210 720 240 C960 270 1200 225 1280 235 L1280 280 L0 280 Z;
M0 225 C240 210 480 255 720 225 C960 210 1200 245 1280 225 L1280 280 L0 280 Z;
M0 235 C240 265 480 210 720 240 C960 270 1200 225 1280 235 L1280 280 L0 280 Z"/>
    </path>

    <!-- Title (Tanmay Style Crisp Bold Centered Text) -->
    <text
        x="640"
        y="125"
        text-anchor="middle"
        font-size="64"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="800"
        letter-spacing="-0.5"
        fill="#FFFFFF"
        filter="url(#shadow)">
        Amandeep Verma
    </text>

    <!-- Subtitle (Tanmay Style Pipe-Separated Subtitle) -->
    <text
        x="640"
        y="175"
        text-anchor="middle"
        font-size="24"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="500"
        fill="#FFFFFF"
        opacity="0.92">
        AI Engineer | Machine Learning | Generative AI | DSA
    </text>

</svg>
