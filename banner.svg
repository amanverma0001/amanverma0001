<svg width="1280" height="300" viewBox="0 0 1280 300" xmlns="http://www.w3.org/2000/svg">

    <defs>
        <!-- Animated Gradient: Purple -> Magenta -> Orange -->
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6426A5">
                <animate attributeName="stop-color"
                    values="#6426A5;#7B2CBF;#6426A5"
                    dur="10s"
                    repeatCount="indefinite"/>
            </stop>

            <stop offset="50%" stop-color="#B83280">
                <animate attributeName="stop-color"
                    values="#B83280;#D53F8C;#B83280"
                    dur="10s"
                    repeatCount="indefinite"/>
            </stop>

            <stop offset="100%" stop-color="#D97706">
                <animate attributeName="stop-color"
                    values="#D97706;#F59E0B;#D97706"
                    dur="10s"
                    repeatCount="indefinite"/>
            </stop>
        </linearGradient>

        <filter id="shadow">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35"/>
        </filter>
    </defs>

    <!-- Background Gradient -->
    <rect width="1280" height="300" fill="url(#bg)"/>

    <!-- Subtle Inner Dark Wave -->
    <path fill="#00000030">
        <animate attributeName="d"
            dur="8s"
            repeatCount="indefinite"
            values="
M0 210 C320 250 640 180 960 220 C1120 240 1200 210 1280 220 L1280 300 L0 300 Z;
M0 200 C320 180 640 230 960 190 C1120 220 1200 240 1280 200 L1280 300 L0 300 Z;
M0 210 C320 250 640 180 960 220 C1120 240 1200 210 1280 220 L1280 300 L0 300 Z"/>
    </path>

    <!-- Bottom Wave Filled with GitHub Dark Background Color (#0D1117) -->
    <!-- Removes the straight rectangle line and blends seamlessly into GitHub! -->
    <path fill="#0D1117">
        <animate attributeName="d"
            dur="6s"
            repeatCount="indefinite"
            values="
M0 235 C280 275 560 205 840 245 C1060 275 1180 225 1280 240 L1280 300 L0 300 Z;
M0 225 C280 205 560 265 840 225 C1060 205 1180 255 1280 225 L1280 300 L0 300 Z;
M0 235 C280 275 560 205 840 245 C1060 275 1180 225 1280 240 L1280 300 L0 300 Z"/>
    </path>

    <!-- Title -->
    <text
        x="640"
        y="118"
        text-anchor="middle"
        font-size="64"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="800"
        letter-spacing="-0.5"
        fill="#FFFFFF"
        filter="url(#shadow)">
        Amandeep Verma
    </text>

    <!-- Subtitle -->
    <text
        x="640"
        y="166"
        text-anchor="middle"
        font-size="24"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="500"
        fill="#FFFFFF"
        opacity="0.92">
        AI Engineer | Machine Learning | Generative AI | DSA
    </text>

</svg>
